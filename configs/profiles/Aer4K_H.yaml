profile_name: "4KAgent-Hybrid-Himalaya"

restoration:
  preference: "Hybrid"  # <--- Triggers the middle column in your selector.py
  target_resolution: [4096, 4096]
  enable_roi_masking: true
  
  allowed_agenda:
    - "cloud removal"
    - "dehazing"
    - "sensor denoising"
    - "super-resolution"

  model_candidates:
    dehazing:
      Hybrid: ["ridcp"]
    super_resolution:
      Hybrid: ["swinir_gan"] # Using GAN for the 4K layer to get that texture pop

qa:
  niqe_rollback_threshold: 5.0       # More forgiving for natural terrain
  entropy_rollback_threshold: 0.40   # Allows the -0.242 RIDCP drop
  dcp_scattering_allowance: 30.0     # <--- The "Snow Fix": allows some DCP increase
  attempt_fallback_on_rollback: false