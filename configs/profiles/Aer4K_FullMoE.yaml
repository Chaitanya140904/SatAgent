profile_name: "4KAgent-Full-MoE-Inference"

restoration:
  preference: "Hybrid"
  target_resolution: [4096, 4096]
  enable_roi_masking: true
  allow_remote_inference: true  # <--- The key to unlocking non-local models
  
  # The Floodgates: Open
  allowed_agenda:
    - "cloud removal"
    - "dehazing"
    - "shadow correction"
    - "sensor denoising"
    - "sensor deblurring"
    - "destriping"
    - "compression artifact removal"
    - "pan-sharpening"
    - "multi-temporal fusion"
    - "super-resolution"

  # We don't map specific models here; we let the API/Inference engine 
  # auto-route to whatever is available in the remote backend.

qa:
  niqe_rollback_threshold: 8.0       # Maximum leniency for a 10-step cascade
  entropy_rollback_threshold: 0.80   
  dcp_scattering_allowance: 50.0
  attempt_fallback_on_rollback: true