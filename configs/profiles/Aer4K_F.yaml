# ============================================================
# SatAgent Profile: Aer4K-F (Fidelity / Mathematical Truth)
# ============================================================
profile_name: "Aer4K-F"

perception:
  vlm_model_id: "unsloth/Llama-3.2-11B-Vision-Instruct-bnb-4bit"
  max_new_tokens: 1024

restoration:
  preference: "Fidelity"
  target_resolution: [4096, 4096]
  enable_roi_masking: true
  enable_temporal_fusion: false
  allowed_agenda:
    - "cloud removal"
    - "dehazing"
    - "sensor denoising"
    - "sensor deblurring"
    - "compression artifact removal"
    - "super-resolution"

  model_candidates:
    denoising:
      Fidelity: ["nafnet_rs", "restormer", "mprnet"]
    deblurring:
      Fidelity: ["mprnet", "restormer"]
    artifact_removal:
      Fidelity: ["swinir_car", "nafnet_jpeg"]
    super_resolution:
      Fidelity: ["swinir_psnr", "transenet"]

qa:
  niqe_rollback_threshold: 4.5       # Reasonable for satellite imagery
  entropy_rollback_threshold: 0.30   # Crucial: allows the -0.242 drop from RIDCP
  super_resolution_entropy_allowance: 15.0
  attempt_fallback_on_rollback: false # Safety: don't let it touch diffgan
  max_rollback_retries: 1